<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080808">
  <title>BACCHUS GROTTO BAR — Digital Card</title>

  <link rel="stylesheet" href="https://use.typekit.net/yiz1rxr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #080808; -webkit-overflow-scrolling: none; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; position: fixed; inset: 0; gap: 18px; padding: 24px; padding-bottom: 12vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4; pointer-events: none; z-index: 0;
    }
    .card-wrapper { position: relative; z-index: 1; opacity: 0; transform: translateY(10px); transition: opacity 0.8s ease, transform 0.8s ease; width: min(90vw, 420px); }
    .card-wrapper.visible { opacity: 1; transform: translateY(0); }
    .card-wrapper::before {
      content: ''; position: absolute; inset: -20px;
      background: radial-gradient(ellipse at center, rgba(180, 140, 70, 0.15) 0%, transparent 70%);
      border-radius: 24px; pointer-events: none; animation: pulse-glow 4s ease-in-out infinite;
    }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    video { display: block; width: 100%; height: auto; border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      position: relative; z-index: 1; }
    .btn-save { position: relative; z-index: 1; width: min(70vw, 300px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 12px 16px; background: #cc1111; border: none; border-radius: 2px; cursor: pointer; color: #ffffff; font-family: "Noto Serif JP", serif; opacity: 0; transform: translateY(10px); transition: opacity 0.8s ease 0.15s, transform 0.8s ease 0.15s, background 0.2s, transform 0.15s; -webkit-tap-highlight-color: transparent; }
    .btn-save.visible { opacity: 1; transform: translateY(0); }
    .btn-save:active { transform: translateY(0) scale(0.98); }
    .btn-save:hover { background: #d42f19; }
    .btn-save .label { font-family: "Cinzel", serif; font-size: 12px; font-weight: 700; letter-spacing: 0.25em; color: #ffffff; }
    .btn-save .sub { font-size: 10px; letter-spacing: 0.05em; color: rgba(255,255,255,0.7); }
    .save-note { position: relative; z-index: 1; width: min(90vw, 420px); text-align: center; font-family: "Noto Serif JP", serif; font-size: 11px; letter-spacing: 0.05em; line-height: 1.7; color: #777777; display: none; opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .save-note.is-open { display: block; opacity: 1; transform: translateY(0); }
    .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: rgba(13,13,13,0.95); border: 1px solid rgba(204,17,17,0.3); color: #ffffff; font-size: 12px; letter-spacing: 0.03em; padding: 12px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; white-space: nowrap; max-width: 88vw; text-align: center; z-index: 5; font-family: "Noto Serif JP", serif; }
    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="card-wrapper" id="cardWrapper">
    <video id="cardVideo" src="final_03-奈穂さん.mp4" playsinline autoplay muted loop preload="auto"></video>
  </div>

  <button class="btn-save" id="btnSaveVideo" type="button">
    <span class="label">動画を保存</span>
    <span class="sub">タップして端末に保存</span>
  </button>

  <p class="save-note" id="saveNote">動画を長押しして「ビデオを保存」を選ぶと保存できます</p>

  <div class="toast" id="toast"></div>

  <script>
    const video      = document.getElementById('cardVideo');
    const wrapper    = document.getElementById('cardWrapper');
    const btnSave    = document.getElementById('btnSaveVideo');
    const saveNote   = document.getElementById('saveNote');
    const toastEl    = document.getElementById('toast');
    const VIDEO_SRC  = video.getAttribute('src');
    const VIDEO_NAME = 'BACCHUS_card_奈穂.mp4';

    video.addEventListener('canplay', () => {
      wrapper.classList.add('visible');
      btnSave.classList.add('visible');
    });

    setTimeout(() => {
      wrapper.classList.add('visible');
      btnSave.classList.add('visible');
    }, 3000);

    document.addEventListener('touchstart', () => {
      if (video.paused) { video.play().catch(() => {}); }
    }, { once: true });

    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toastEl.textContent = msg;
      toastEl.classList.add('is-visible');
      toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 2800);
    }

    function openFallbackNote() { saveNote.classList.add('is-open'); }

    const isInAppBrowser = /Line|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);
    const isAndroid      = /Android/i.test(navigator.userAgent);

    function downloadFile(file) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    btnSave.addEventListener('click', async () => {
      if (isInAppBrowser) { openFallbackNote(); return; }

      let file;
      try {
        const res  = await fetch(VIDEO_SRC);
        const blob = await res.blob();
        file = new File([blob], VIDEO_NAME, { type: blob.type || 'video/mp4' });
      } catch (e) { openFallbackNote(); return; }

      // 共有シート経由（iPhone/Androidどちらも）：
      // Androidはこれで「フォトに保存」を選べるようになる
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: document.title });
          showToast('動画を保存できました');
          return;
        } catch (err) { if (err && err.name === 'AbortError') return; }
      }

      try {
        downloadFile(file);
        showToast('動画を保存しました。ファイルアプリからも見られます');
      } catch (err) { openFallbackNote(); }
    });
  </script>

</body>
</html>
